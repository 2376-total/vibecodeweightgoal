<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to 170</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h2 { margin-top: 0; text-align: center; color: #38bdf8; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #94a3b8; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .btn-calc { background: #38bdf8; color: #0f172a; }
    .btn-checkin { background: #22c55e; color: #0f172a; }
    .stats {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #334155;
      text-align: center;
    }
    .big-num { font-size: 28px; font-weight: bold; color: #38bdf8; }
    .progress-bar {
      background: #334155;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🎯 Target: 170 lbs</h2>

  <label>Current Weight (lbs)</label>
  <input type="number" id="currentWeight" placeholder="e.g. 190">

  <label>Maintenance Calories (TDEE)</label>
  <input type="number" id="maintenance" placeholder="e.g. 2100">

  <label>Daily Calorie Target</label>
  <input type="number" id="intakeTarget" value="1500">

  <button class="btn-calc" onclick="calculatePlan()">Update Timeline</button>

  <div class="stats" id="statsSection" style="display:none;">
    <div id="countdownText" style="margin-bottom: 8px;"></div>
    <div class="big-num" id="daysTracked">0 / 0 Days</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="btn-checkin" onclick="logDay()">✅ Hit Target Today!</button>
    <button style="background:transparent; color:#ef4444; font-size:12px; margin-top:8px;" onclick="resetCheckins()">Reset logged days</button>
  </div>
</div>

<script>
  let daysCompleted = parseInt(localStorage.getItem('daysCompleted')) || 0;
  let totalDaysNeeded = parseInt(localStorage.getItem('totalDaysNeeded')) || 0;

  // Restore saved inputs
  ['currentWeight', 'maintenance', 'intakeTarget'].forEach(id => {
    if (localStorage.getItem(id)) {
      document.getElementById(id).value = localStorage.getItem(id);
    }
  });

  if (localStorage.getItem('totalDaysNeeded')) {
    updateUI();
  }

  function calculatePlan() {
    const cur = parseFloat(document.getElementById('currentWeight').value);
    const maint = parseFloat(document.getElementById('maintenance').value);
    const intake = parseFloat(document.getElementById('intakeTarget').value);

    if (!cur || !maint || !intake) return alert("Please fill in all fields.");
    if (cur <= 170) return alert("You're already at or below 170 lbs!");

    const deficit = maint - intake;
    if (deficit <= 0) return alert("Your daily intake must be lower than maintenance.");

    const weightToLose = cur - 170;
    const totalDeficitNeeded = weightToLose * 3500;
    totalDaysNeeded = Math.ceil(totalDeficitNeeded / deficit);

    // Save state
    localStorage.setItem('currentWeight', cur);
    localStorage.setItem('maintenance', maint);
    localStorage.setItem('intakeTarget', intake);
    localStorage.setItem('totalDaysNeeded', totalDaysNeeded);

    updateUI();
  }

  function logDay() {
    daysCompleted++;
    localStorage.setItem('daysCompleted', daysCompleted);
    updateUI();
  }

  function resetCheckins() {
    if (confirm("Reset completed days to 0?")) {
      daysCompleted = 0;
      localStorage.setItem('daysCompleted', 0);
      updateUI();
    }
  }

  function updateUI() {
    document.getElementById('statsSection').style.display = 'block';
    document.getElementById('daysTracked').innerText = `${daysCompleted} / ${totalDaysNeeded} Days`;
    
    const pct = Math.min(100, Math.round((daysCompleted / totalDaysNeeded) * 100 || 0));
    document.getElementById('progressFill').style.width = pct + '%';
    
    const remaining = Math.max(0, totalDaysNeeded - daysCompleted);
    document.getElementById('countdownText').innerText = 
      `${remaining} days left at ${document.getElementById('intakeTarget').value} kcal to hit 170 lbs (${pct}% completed)`;
  }
</script>

</body>
</html>
