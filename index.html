<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deficit Runway</title>
  
  <!-- Tab Favicon & Phone Home Screen Icon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/2376-total/vibecodeweightgoal/refs/heads/main/6534064.png">
  <link rel="shortcut icon" href="https://raw.githubusercontent.com/2376-total/vibecodeweightgoal/refs/heads/main/6534064.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/2376-total/vibecodeweightgoal/refs/heads/main/6534064.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: #131d31;
      padding: 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title-group h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }
    .title-group p {
      margin: 2px 0 0;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
    }
    .menu-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .stats-container {
      text-align: center;
      padding: 10px 0;
    }
    .day-badge {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
    }
    .big-num {
      font-size: 38px;
      font-weight: 800;
      color: #38bdf8;
      margin: 6px 0 12px;
    }
    .progress-bar {
      background: #1e293b;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin: 16px 0;
      border: 1px solid #334155;
    }
    .progress-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.4s ease;
    }
    .info-card {
      background: #090d16;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 14px;
      line-height: 1.5;
    }

    /* REALTIME FAT LOSS BOX */
    .live-counter-box {
      margin-top: 14px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: 12px;
      padding: 12px;
    }
    .live-label {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #22c55e;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .live-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      margin-top: 5px;
      letter-spacing: -0.5px;
    }
    .live-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .finish-date {
      color: #38bdf8;
      font-weight: 700;
      font-size: 14px;
      margin-top: 14px;
    }

    /* POPUP MENU */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal {
      background: #131d31;
      border: 1px solid #334155;
      padding: 22px;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header h3 { margin: 0; font-size: 18px; color: #f8fafc; }
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #090d16;
      color: white;
      font-size: 15px;
      box-sizing: border-box;
    }
    .save-btn {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      background: #38bdf8;
      color: #090d16;
      cursor: pointer;
    }
    .reset-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ef4444;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      background: transparent;
      color: #ef4444;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Top Navigation Bar -->
  <div class="header">
    <div class="title-group">
      <h1>Deficit Runway</h1>
      <p id="targetSubtext">Target: 170 lbs</p>
    </div>
    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>

  <!-- Live Progress Section -->
  <div class="stats-container" id="statsSection">
    <div class="day-badge">Live Day Tracker</div>
    <div class="big-num" id="dayCounter">Day 1 of --</div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="info-card" id="summaryBox">
      Tap the <b>☰</b> menu to enter your numbers and start tracking.
    </div>

    <!-- Realtime Pounds Lost Counter -->
    <div class="live-counter-box">
      <div class="live-label">
        <span class="live-dot"></span>
        <span>Realtime Fat Burned</span>
      </div>
      <div class="live-value" id="livePoundsVal">0.000000 lbs</div>
      <div class="live-sub" id="livePoundsLeft">Calculating remaining...</div>
    </div>

    <!-- Projected Finish Date -->
    <div class="finish-date" id="finishDate"></div>
  </div>
</div>

<!-- Settings Popup Modal -->
<div class="modal-overlay" id="menuModal">
  <div class="modal">
    <div class="modal-header">
      <h3 style="color: #38bdf8;">Plan Settings</h3>
      <button class="close-btn" onclick="closeMenu()">✕</button>
    </div>

    <div class="grid-2">
      <div>
        <label>Current Weight</label>
        <input type="number" id="currentWeight" placeholder="195">
      </div>
      <div>
        <label>Goal Weight</label>
        <input type="number" id="targetWeight" value="170">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Maintenance (TDEE)</label>
        <input type="number" id="maintenance" value="2300">
      </div>
      <div>
        <label>Daily Intake Target</label>
        <input type="number" id="intakeTarget" value="1500">
      </div>
    </div>

    <label>Journey Start Date</label>
    <input type="date" id="startDate">

    <button class="save-btn" onclick="saveSettings()">Save Changes (Keep Streak)</button>
    <button class="reset-btn" onclick="resetToDayOne()">Restart from Day 1 Today</button>
  </div>
</div>

<script>
  let liveAnimationTimer = null;
  let displayedPounds = null;
  const todayStr = new Date().toISOString().split('T')[0];

  ['currentWeight', 'targetWeight', 'maintenance', 'intakeTarget', 'startDate'].forEach(id => {
    const saved = localStorage.getItem(id);
    if (saved) document.getElementById(id).value = saved;
  });

  if (!localStorage.getItem('startDate')) {
    document.getElementById('startDate').value = todayStr;
    openMenu();
  } else {
    updateDisplay();
  }

  function openMenu() {
    document.getElementById('menuModal').style.display = 'flex';
  }

  function closeMenu() {
    document.getElementById('menuModal').style.display = 'none';
  }

  function saveSettings() {
    const cur = parseFloat(document.getElementById('currentWeight').value);
    const target = parseFloat(document.getElementById('targetWeight').value);
    const maint = parseFloat(document.getElementById('maintenance').value);
    const intake = parseFloat(document.getElementById('intakeTarget').value);
    const startVal = document.getElementById('startDate').value;

    if (!cur || !target || !maint || !intake || !startVal) {
      alert("Please fill in all values.");
      return;
    }

    if (cur <= target) {
      alert("Current weight must be higher than your goal weight.");
      return;
    }

    if (maint <= intake) {
      alert("Daily intake must be lower than maintenance calories.");
      return;
    }

    localStorage.setItem('currentWeight', cur);
    localStorage.setItem('targetWeight', target);
    localStorage.setItem('maintenance', maint);
    localStorage.setItem('intakeTarget', intake);
    localStorage.setItem('startDate', startVal);

    closeMenu();
    updateDisplay();
  }

  function resetToDayOne() {
    const confirmed = confirm(
      "Are you sure you want to reset your start date to today and restart your counter at Day 1?"
    );

    if (confirmed) {
      document.getElementById('startDate').value = todayStr;
      displayedPounds = 0;
      saveSettings();
    }
  }

  function updateDisplay() {
    const cur = parseFloat(localStorage.getItem('currentWeight'));
    const target = parseFloat(localStorage.getItem('targetWeight'));
    const maint = parseFloat(localStorage.getItem('maintenance'));
    const intake = parseFloat(localStorage.getItem('intakeTarget'));
    const startStr = localStorage.getItem('startDate');

    if (!cur || !target || !maint || !intake || !startStr) return;

    document.getElementById('targetSubtext').innerText = `Target: ${target} lbs`;

    const dailyDeficit = maint - intake;
    const totalPounds = cur - target;
    const totalDeficitNeeded = totalPounds * 3500;
    const totalDays = Math.ceil(totalDeficitNeeded / dailyDeficit);

    // Midnight of start date
    const start = new Date(startStr + "T00:00:00");
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const diffDays = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
    const currentDay = Math.max(1, diffDays);
    const remainingDays = Math.max(0, totalDays - currentDay);

    const projected = new Date(start);
    projected.setDate(projected.getDate() + totalDays);
    const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };

    document.getElementById('dayCounter').innerText = `Day ${currentDay} of ${totalDays}`;

    const percent = Math.min(100, Math.round((currentDay / totalDays) * 100));
    document.getElementById('progressFill').style.width = percent + '%';

    document.getElementById('summaryBox').innerHTML =
      `Deficit: <b>${dailyDeficit} kcal/day</b><br><b>${remainingDays} days</b> left at ${intake} kcal to finish (${percent}% completed).`;

    document.getElementById('finishDate').innerText =
      `🏁 Projected Finish: ${projected.toLocaleDateString(undefined, dateOptions)}`;

    // SMOOTH ROLLING ODOMETER (Updates every 40 milliseconds)
    if (liveAnimationTimer) clearInterval(liveAnimationTimer);

    const lbsPerMs = dailyDeficit / (3500 * 86400 * 1000);

    function tickGradualCounter() {
      const currentTime = new Date();
      const elapsedMs = Math.max(0, currentTime - start);
      const trueTargetBurned = Math.min(totalPounds, elapsedMs * lbsPerMs);

      // Initialize on first load slightly behind target so it rolls in smoothly
      if (displayedPounds === null) {
        displayedPounds = Math.max(0, trueTargetBurned - 0.000030);
      }

      // If behind, smoothly roll towards the true number instead of jumping
      if (displayedPounds < trueTargetBurned) {
        const diff = trueTargetBurned - displayedPounds;
        // Step size smoothly scales so it catches up gracefully
        const step = Math.max(0.000001, diff * 0.08);
        displayedPounds += step;

        if (displayedPounds >= trueTargetBurned) {
          displayedPounds = trueTargetBurned;
        }
      } else {
        displayedPounds = trueTargetBurned;
      }

      const remainingBurn = Math.max(0, totalPounds - displayedPounds);

      // Exactly 6 decimal places, rolling gradually
      document.getElementById('livePoundsVal').innerText = `${displayedPounds.toFixed(6)} lbs`;
      document.getElementById('livePoundsLeft').innerText = `~${remainingBurn.toFixed(4)} lbs left to goal`;
    }

    tickGradualCounter();
    liveAnimationTimer = setInterval(tickGradualCounter, 40); // 40ms smooth loop
  }
</script>

</body>
</html>
