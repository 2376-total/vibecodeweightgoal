<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weight Deficit Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #38bdf8; 
      font-size: 22px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label { 
      display: block; 
      margin-top: 10px; 
      font-size: 13px; 
      color: #94a3b8; 
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
    }
    .stats {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      text-align: center;
    }
    .big-num { 
      font-size: 32px; 
      font-weight: 800; 
      color: #38bdf8; 
      margin: 6px 0;
    }
    .progress-bar {
      background: #334155;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.4s ease;
    }
    .info-pill {
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .target-date {
      color: #22c55e;
      font-weight: bold;
      margin-top: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 id="headerTitle">🎯 Weight Loss Journey</h2>

  <div class="grid-2">
    <div>
      <label>Current (lbs)</label>
      <input type="number" id="currentWeight" placeholder="e.g. 195">
    </div>
    <div>
      <label>Target Goal (lbs)</label>
      <input type="number" id="targetWeight" value="170">
    </div>
  </div>

  <div class="grid-2">
    <div>
      <label>Maintenance (TDEE)</label>
      <input type="number" id="maintenance" placeholder="e.g. 2100">
    </div>
    <div>
      <label>Target Intake (kcal)</label>
      <input type="number" id="intakeTarget" value="1500">
    </div>
  </div>

  <label>Journey Start Date</label>
  <input type="date" id="startDate">

  <button onclick="calculatePlan()">Save & Update Timeline</button>

  <div class="stats" id="statsSection" style="display:none;">
    <div style="font-size: 13px; color: #94a3b8;">LIVE PROGRESS</div>
    <div class="big-num" id="dayCounter">Day 1 of 0</div>
    
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="info-pill" id="deficitSummary"></div>
    <div class="target-date" id="projectedDate"></div>
  </div>
</div>

<script>
  // Set default start date to today in YYYY-MM-DD
  const todayStr = new Date().toISOString().split('T')[0];

  // Restore stored data
  const fields = ['currentWeight', 'targetWeight', 'maintenance', 'intakeTarget', 'startDate'];
  fields.forEach(f => {
    const val = localStorage.getItem(f);
    if (val) document.getElementById(f).value = val;
  });

  if (!document.getElementById('startDate').value) {
    document.getElementById('startDate').value = todayStr;
  }

  // Auto-run if saved values exist
  if (localStorage.getItem('currentWeight') && localStorage.getItem('maintenance')) {
    calculatePlan();
  }

  function calculatePlan() {
    const current = parseFloat(document.getElementById('currentWeight').value);
    const target = parseFloat(document.getElementById('targetWeight').value);
    const maint = parseFloat(document.getElementById('maintenance').value);
    const intake = parseFloat(document.getElementById('intakeTarget').value);
    const startVal = document.getElementById('startDate').value;

    if (!current || !target || !maint || !intake || !startVal) {
      alert("Please fill in all fields.");
      return;
    }

    if (current <= target) {
      alert("Current weight is already at or below target weight!");
      return;
    }

    const deficit = maint - intake;
    if (deficit <= 0) {
      alert("Your daily calorie target must be lower than your maintenance calories.");
      return;
    }

    // Save fields
    localStorage.setItem('currentWeight', current);
    localStorage.setItem('targetWeight', target);
    localStorage.setItem('maintenance', maint);
    localStorage.setItem('intakeTarget', intake);
    localStorage.setItem('startDate', startVal);

    // Update Header
    document.getElementById('headerTitle').innerText = `🎯 Road to ${target} lbs`;

    // 1 lb fat ≈ 3,500 kcal
    const weightToLose = current - target;
    const totalDeficitNeeded = weightToLose * 3500;
    const totalDaysNeeded = Math.ceil(totalDeficitNeeded / deficit);

    // Live Day Calculation (Calendar-based)
    const start = new Date(startVal + "T00:00:00");
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    const diffMs = today - start;
    const daysElapsed = Math.floor(diffMs / (1000 * 60 * 60 * 24)) + 1; // Start day = Day 1

    const currentDayDisplay = Math.max(1, daysElapsed);
    const remainingDays = Math.max(0, totalDaysNeeded - currentDayDisplay);

    // Projected Goal Date
    const projectedDate = new Date(start);
    projectedDate.setDate(projectedDate.getDate() + totalDaysNeeded);
    const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };

    // Update UI
    document.getElementById('statsSection').style.display = 'block';
    document.getElementById('dayCounter').innerText = `Day ${currentDayDisplay} of ${totalDaysNeeded}`;

    const percent = Math.min(100, Math.max(0, Math.round((currentDayDisplay / totalDaysNeeded) * 100)));
    document.getElementById('progressFill').style.width = percent + '%';

    document.getElementById('deficitSummary').innerHTML = 
      `<b>${remainingDays} days</b> remaining at ${intake} kcal/day (${percent}% finished)`;

    document.getElementById('projectedDate').innerText = 
      `🏁 Estimated Finish: ${projectedDate.toLocaleDateString(undefined, dateOptions)}`;
  }
</script>

</body>
</html>
